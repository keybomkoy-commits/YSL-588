    <script>
        /* ระบบละอองฝุ่นทองแบบมีมิติ (Depth Particles) */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }
        window.addEventListener('resize', resizeCanvas); 
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset(true);
            }
            reset(initial = false) {
                this.x = initial ? Math.random() * canvas.width : -10;
                this.y = Math.random() * canvas.height;
                this.depth = Math.random();
                this.size = (this.depth * 1.8) + 0.4;
                this.speedX = (this.depth * 2.2) + 0.5;
                this.speedY = (Math.random() - 0.5) * 0.6;
                this.baseOpacity = (this.depth * 0.38) + 0.06;
                this.pulseSpeed = Math.random() * 0.02 + 0.005;
                this.pulsePhase = Math.random() * Math.PI * 2;
                this.windFactor = Math.random() * 0.02 + 0.005;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY + Math.sin(this.x * this.windFactor) * 0.45;
                this.pulsePhase += this.pulseSpeed;

                if (this.x > canvas.width + 15) this.reset(false);
                if (this.y < -15) this.y = canvas.height + 15;
                if (this.y > canvas.height + 15) this.y = -15;
            }
            draw() {
                const currentOpacity = this.baseOpacity * (0.7 + 0.3 * Math.sin(this.pulsePhase));
                ctx.fillStyle = `rgba(222, 184, 78, ${currentOpacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        const particleCount = Math.floor((window.innerWidth * window.innerHeight) / 8500); 
        for (let i = 0; i < particleCount; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        /* เอฟเฟกต์ขยับตามเมาส์แบบสมูท (Smooth Mouse Parallax) */
        const bgImage = document.getElementById('bg-image');
        const parallaxLogo = document.getElementById('parallaxLogo');
        const parallaxHeader = document.getElementById('parallaxHeader');
        let targetX = 0, targetY = 0, currentX = 0, currentY = 0;

        window.addEventListener('mousemove', (e) => {
            targetX = (e.clientX / window.innerWidth - 0.5) * 2;
            targetY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function updateParallax() {
            currentX += (targetX - currentX) * 0.05;
            currentY += (targetY - currentY) * 0.05;

            if (bgImage) {
                bgImage.style.transform = `translate3d(${-currentX * 12}px, ${-currentY * 12}px, 0) scale(1.05)`;
            }
            if (parallaxLogo) {
                parallaxLogo.style.transform = `translate3d(${currentX * 8}px, ${currentY * 6}px, 0)`;
            }
            if (parallaxHeader) {
                parallaxHeader.style.transform = `translate3d(${currentX * 4}px, ${currentY * 3}px, 0)`;
            }
            requestAnimationFrame(updateParallax);
        }
        updateParallax();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpUyXfCAFweKeCt-R1ve8GmirfW6AH7aw",
            authDomain: "ysl588.firebaseapp.com",
            projectId: "ysl588",
            storageBucket: "ysl588.firebasestorage.app",
            messagingSenderId: "944621925342",
            appId: "1:944621925342:web:4f3b8ee76f169bfc52234f"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const audio = document.getElementById('bgMusic');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const musicWidget = document.getElementById('musicWidget');
        const toggleMusicBtn = document.getElementById('toggleMusicBtn');
        const toggleIcon = document.getElementById('toggleIcon');
        
        let isPlaying = false; 
        audio.volume = 0.2;
        volumeSlider.value = 0.2;

        const savedTime = sessionStorage.getItem('musicCurrentTime');
        const userStopped = sessionStorage.getItem('userStoppedMusic');
        if (savedTime) audio.currentTime = parseFloat(savedTime);

        if (userStopped !== 'true' && sessionStorage.getItem('musicIsPlaying') === 'true') {
            audio.play().then(() => { playPauseBtn.innerHTML = '❚❚'; musicWidget.classList.add('playing'); isPlaying = true; }).catch(e=>{});
        }

        window.addEventListener('beforeunload', () => {
            sessionStorage.setItem('musicCurrentTime', audio.currentTime);
            sessionStorage.setItem('musicIsPlaying', isPlaying);
        });

        document.body.addEventListener('click', (e) => {
            if (sessionStorage.getItem('userStoppedMusic') === 'true') return;
            if (!isPlaying && !e.target.closest('#playPauseBtn') && !e.target.closest('.vol-slider') && !e.target.closest('.music-widget')) {
                audio.play().then(() => { 
                    playPauseBtn.innerHTML = '❚❚'; 
                    musicWidget.classList.add('playing'); 
                    isPlaying = true; 
                    sessionStorage.setItem('musicIsPlaying', 'true'); 
                    sessionStorage.setItem('userStoppedMusic', 'false');
                }).catch(e=>{});
            }
        });

        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) { 
                audio.pause(); 
                playPauseBtn.innerHTML = '▶'; 
                musicWidget.classList.remove('playing'); 
                sessionStorage.setItem('musicIsPlaying', 'false');
                sessionStorage.setItem('userStoppedMusic', 'true');
            } else { 
                audio.play().then(() => { 
                    playPauseBtn.innerHTML = '❚❚'; 
                    musicWidget.classList.add('playing'); 
                    sessionStorage.setItem('musicIsPlaying', 'true');
                    sessionStorage.setItem('userStoppedMusic', 'false');
                }).catch(e=>{}); 
            }
            isPlaying = !isPlaying;
        });

        volumeSlider.addEventListener('input', (e) => { audio.volume = e.target.value; });
        toggleMusicBtn.addEventListener('click', (e) => {
            if (e.target.tagName.toLowerCase() === 'a') return;
            musicWidget.classList.toggle('collapsed');
            musicWidget.classList.toggle('expanded');
            toggleIcon.style.transform = musicWidget.classList.contains('expanded') ? 'rotate(180deg)' : 'rotate(0deg)';
        });

        onSnapshot(doc(db, "settings", "homepage"), (docSnap) => {
            if (docSnap.exists()) {
                const cfg = docSnap.data();
                if (cfg.bgUrl) document.getElementById('bg-image').style.backgroundImage = `url('${cfg.bgUrl}')`;
                if (cfg.faviconUrl) document.getElementById('siteFavicon').href = cfg.faviconUrl;
                if (cfg.mainTitle) document.getElementById('dynMainTitle').innerText = cfg.mainTitle;
                if (cfg.subTitle) document.getElementById('dynSubTitle').innerText = cfg.subTitle;
                if (cfg.logoUrl) {
                    const logo = document.getElementById('mainLogo');
                    logo.src = cfg.logoUrl; logo.style.display = 'block';
                    if (cfg.logoWidth) logo.style.width = cfg.logoWidth;
                }
                if (cfg.musicTitle) document.getElementById('musicTitle').innerText = cfg.musicTitle;
                if (cfg.musicLinkText) document.getElementById('musicLink').innerText = cfg.musicLinkText;
                if (cfg.musicLinkUrl) document.getElementById('musicLink').href = cfg.musicLinkUrl;
                if (cfg.musicCoverUrl) document.getElementById('musicCover').src = cfg.musicCoverUrl;
            }
        });

        onSnapshot(doc(db, "settings", "partners"), (docSnap) => {
            const partnerGroup = document.getElementById('partnerButtonsGroup');
            const partnerWrapper = document.getElementById('partnerSectionWrapper');
            partnerGroup.innerHTML = '';
            
            const list = (docSnap.exists() && Array.isArray(docSnap.data().list)) ? docSnap.data().list : [];
            if (list.length === 0) {
                partnerWrapper.style.display = 'none';
                return;
            }

            partnerWrapper.style.display = 'flex';
            list.forEach((p) => {
                const a = document.createElement('a');
                a.href = p.url || '#';
                a.target = '_blank';
                a.className = 'partner-btn';
                a.innerHTML = `<span>${p.name}</span><span class="partner-arrow">↗</span>`;
                partnerGroup.appendChild(a);
            });
        });
    </script>
</body>
